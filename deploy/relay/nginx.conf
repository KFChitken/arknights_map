# The second door (server B): passes visitors' TCP connections through to the main server (A) over the
# private network, nothing more. 443 goes with the PROXY protocol, so A's Caddy (its :8443 listener, only
# for B) still knows each visitor's address; 80 goes as it is (redirects to HTTPS, certificate checks).
# TLS, compression, certificates and every route stay on A. Nothing is logged or stored here: no access
# log, and errors only when nginx itself cannot run. scripts/relay-setup.sh writes A_PRIVATE in.
user www-data;
worker_processes auto;
worker_rlimit_nofile 1048576;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log emerg;
include /etc/nginx/modules-enabled/*.conf;

events {
	# each visitor takes two: their own connection, and B's to A
	worker_connections 65535;
}

stream {
	server {
		listen 443 reuseport;
		proxy_pass A_PRIVATE:8443;
		proxy_protocol on;
		proxy_connect_timeout 3s;
		# the live event stream (/api/events) stays open for long stretches with little in it
		proxy_timeout 1h;
	}
	server {
		listen 80 reuseport;
		proxy_pass A_PRIVATE:80;
		proxy_connect_timeout 3s;
		proxy_timeout 1m;
	}
}
