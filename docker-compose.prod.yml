# The live site. Caddy serves HTTPS and is the only service reachable from
# outside; the app and the database sit on the internal network. scripts/deploy.sh
# brings it up from the repository root on the server.
name: zhoupmap

# Docker keeps everything a container prints unless told otherwise: at most five files of 20 MB each
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

# What the app's three processes share (services web, web2 and web3 below)
x-web: &web
  image: ghcr.io/kfchitken/arknights_map:${WEB_TAG:-latest}
  logging: *logging
  env_file: .env
  volumes:
    # the character pictures, kept out of the repository and the image; scripts/deploy.sh copies them here
    - ./operator-art:/app/operator-art:ro
    - ./guide-art:/app/guide-art:ro
    # where each process writes down how far its roach list has got (FEED_STATE), to take up from
    # there after a restart instead of sending every open page the whole list again (src/lib/server/roachFeed.ts)
    - feed-state:/app/feed-state
  restart: unless-stopped

x-web-env: &web-env
  DATABASE_URL: postgres://roach:${DB_PASSWORD}@db:5432/roach
  OPERATOR_ART_DIR: /app/operator-art
  GUIDE_ART_DIR: /app/guide-art
  # never link a test inbox on the live site
  DEV_MAILBOX_PORT: ""
  # nudges go between the processes through the database
  LIVE_ACROSS: "1"

services:
  db:
    image: imresamu/postgis:17-3.5
    # Postgres's own defaults are for a small machine (shared_buffers 128 MB); these are for this one, 8 GB
    # shared with Caddy and three app processes. Memory is tight (2.3 GB available at noon on 11/11, with
    # the app processes at 1 GB each), so shared_buffers starts at 512 MB: raise it once some of the app
    # runs on the second server. pg_stat_statements keeps which queries take the time
    # (`create extension if not exists pg_stat_statements;` once, then select from pg_stat_statements).
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=3GB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_wal_size=2GB
      -c wal_compression=on
      -c shared_preload_libraries=pg_stat_statements
    # shared memory for parallel queries, past Docker's 64 MB
    shm_size: 512mb
    logging: *logging
    environment:
      POSTGRES_USER: roach
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: roach
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # over TCP: during first-time setup Postgres runs briefly on its socket only, then restarts
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U roach -d roach"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The app, as three processes so it uses more than one core (each runs its JavaScript on one):
  # web brings the database up to date and runs the jobs; web2 and web3 only answer requests
  # (src/instrumentation-node.ts). Caddy shares visitors among them (deploy/Caddyfile), and a nudge
  # for a page reaches whichever of them it is connected to (src/lib/server/live.ts).
  web:
    <<: *web
    # Built by GitHub for every push to main (.github/workflows/image.yml) and pulled
    # by scripts/deploy.sh; built here instead only when that image is not available
    build:
      context: .
      args:
        NEXT_PUBLIC_AMAP_KEY: ${NEXT_PUBLIC_AMAP_KEY:-}
        NEXT_PUBLIC_AMAP_SECURITY_CODE: ${NEXT_PUBLIC_AMAP_SECURITY_CODE:-}
        NEXT_PUBLIC_OSM_STYLE: ${NEXT_PUBLIC_OSM_STYLE:-}
        NEXT_PUBLIC_TENCENT_KEY: ${NEXT_PUBLIC_TENCENT_KEY:-}
    environment:
      <<: *web-env
      FEED_STATE: /app/feed-state/web.json
      # the site's own checks also ask it through the second server (deploy/relay), by its private address
      WATCH_DOORS: "10.5.0.15"
    depends_on:
      db:
        condition: service_healthy

  web2:
    <<: *web
    environment:
      <<: *web-env
      WEB_ROLE: helper
      FEED_STATE: /app/feed-state/web2.json
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  web3:
    <<: *web
    environment:
      <<: *web-env
      WEB_ROLE: helper
      FEED_STATE: /app/feed-state/web3.json
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  # Adds the visitor's address to X-Forwarded-For, which the login limits rely on
  caddy:
    image: caddy:2.10
    # (no log rotation yet: it prints little, and changing it restarts the gateway, which drops every visitor)
    environment:
      # Go collects harder as the gateway nears this, instead of growing until the system kills it
      # (it was, at 3.9 GB, with some 2,400 slow connections open)
      GOMEMLIMIT: 2GiB
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # the second server's entrance (deploy/Caddyfile), on this server's private address only:
      # Docker's published ports go around the system's own firewall
      - "10.5.0.6:8443:8443"
    volumes:
      # the folder, not the file: git replaces the file on pull, which a file mount would not see
      - ./deploy:/etc/caddy:ro
      # our own overseas map, put on the server by hand (see the README) and served by Caddy
      - ./tiles:/srv/tiles:ro
      # the characters' pictures, which scripts/deploy.sh copies here, served by Caddy too (deploy/Caddyfile)
      - ./operator-art:/srv/operator-art:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - web2
      - web3
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
  feed-state:
