name: Image

# Builds the app image for every push to main and puts it on GitHub's registry,
# so the server only downloads it (scripts/deploy.sh) instead of building it
# itself. The image holds no secrets: the server's .env is read when the
# container starts.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_AMAP_KEY: ${{ secrets.AMAP_KEY }}
      NEXT_PUBLIC_AMAP_SECURITY_CODE: ${{ secrets.AMAP_SECURITY_CODE }}
    steps:
      - uses: actions/checkout@v4
      - name: Name the image
        run: |
          if [ -z "$NEXT_PUBLIC_AMAP_KEY" ] || [ -z "$NEXT_PUBLIC_AMAP_SECURITY_CODE" ]; then
            echo "::error::Add the AMAP_KEY and AMAP_SECURITY_CODE repository secrets; without them the China basemap would not load"
            exit 1
          fi
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_AMAP_KEY=${{ env.NEXT_PUBLIC_AMAP_KEY }}
            NEXT_PUBLIC_AMAP_SECURITY_CODE=${{ env.NEXT_PUBLIC_AMAP_SECURITY_CODE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Make sure no server secret is in the image
        run: |
          docker run --rm --entrypoint sh "$IMAGE:$GITHUB_SHA" -c \
            'for f in .env .env.local .env.production; do if [ -e "/app/$f" ]; then echo "found /app/$f"; exit 1; fi; done'
          if docker image inspect --format '{{json .Config.Env}}' "$IMAGE:$GITHUB_SHA" | grep -E 'AUTH_SECRET|DB_PASSWORD|SMTP_URL|DATABASE_URL'; then
            echo "::error::a server secret is in the image settings"
            exit 1
          fi
      - name: Publish
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
